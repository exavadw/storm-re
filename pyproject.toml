[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-re"
version = "0.1.0"
description = "Build-aware resolver, decompile cache and MCP server for Storm-engine game RE (no game data included)"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
storm-re = "storm_re.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
